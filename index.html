<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jepico – Mes applications</title>
  <meta name="description" content="Jepico : retrouvez mes applications Cave à vin et Score Cartes.">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #e4e2dc;
      --accent: #3b5bdb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131316;
        --card: #1e1e23;
        --text: #f2f2f4;
        --muted: #9a9aa3;
        --border: #2d2d34;
        --accent: #7c93ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { margin: 0 0 8px; font-size: 2.2rem; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); }
    main {
      width: 100%;
      max-width: 720px;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
    .card {
      display: block;
      padding: 28px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
      outline: none;
    }
    .emoji { font-size: 2.2rem; display: block; margin-bottom: 12px; }
    .card h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .card p { margin: 0 0 14px; color: var(--muted); font-size: .95rem; line-height: 1.4; }
    .card .url { color: var(--accent); font-size: .9rem; font-weight: 500; }
    footer { margin-top: auto; padding-top: 48px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Jepico</h1>
    <p>Mes applications</p>
  </header>

  <main>
    <a class="card" href="https://caveavin.jepico.fr">
      <span class="emoji" aria-hidden="true">🍷</span>
      <h2>Cave à vin</h2>
      <p>Gérez et suivez votre cave à vin.</p>
      <span class="url">caveavin.jepico.fr →</span>
    </a>

    <a class="card" href="https://scorecartes.jepico.fr">
      <span class="emoji" aria-hidden="true">🃏</span>
      <h2>Score Cartes</h2>
      <p>Comptez les points de vos parties de cartes.</p>
      <span class="url">scorecartes.jepico.fr →</span>
    </a>
  </main>

  <footer>© Jepico</footer>
</body>
</html>
